name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 Input is complete", "2 Never correct grammar", "3 Content not form", "4 Full understanding", "5 One interpretation, easy out", "6 A-or-B choices", "7 Never baby talk", "8 Never comment on typing", "9 No follow-ups into silence", "10 Echoes are valid", "11 Same format", "12 I don't understand yet", "New rule (say which one it replaces)"]
    validations:
      required: true
