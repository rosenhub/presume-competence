<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #8b949e; }
      .q { font-size: 17px; fill: #c9d1d9; }
      .a { font-size: 16px; fill: #e6edf3; }
      .dim { fill: #6e7681; }
      .strike { fill: #8b949e; text-decoration: line-through; }
      .good { fill: #3fb950; }
      .bad { fill: #f85149; }
      .meta { font-size: 13px; fill: #8b949e; }
      .bubble-user { fill: #1f6feb; }
      .bubble-ai { fill: #161b22; stroke: #30363d; }
      .title { font-size: 30px; font-weight: 800; fill: #e6edf3; }
      .sub { font-size: 16px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#010409"/>

  <text x="600" y="48" text-anchor="middle" class="title">"water"</text>
  <text x="600" y="74" text-anchor="middle" class="sub">One word, typed after an earlier exchange about the kitchen. Same model. Only difference: one file in the system prompt.</text>

  <!-- BEFORE -->
  <rect x="40" y="100" width="545" height="420" rx="12" class="panel"/>
  <text x="64" y="130" class="label">BEFORE</text>
  <text x="560" y="130" text-anchor="end" class="meta bad">82 words · 3 questions</text>

  <rect x="64" y="148" width="497" height="334" rx="10" class="bubble-ai"/>
  <g class="a" font-size="15">
    <text x="84" y="176">Great job letting me know! I'd be happy to help with</text>
    <text x="84" y="198">water. Could you tell me a little more about what you</text>
    <text x="84" y="220">need? Did you mean you'd like a glass of water, or is</text>
    <text x="84" y="242">this about the kitchen water we were talking about</text>
    <text x="84" y="264">earlier, like the tap or the filter? Also, is this for</text>
    <text x="84" y="286">right now or for later? Take your time, there's no rush.</text>
    <text x="84" y="308">Just let me know in a full sentence and I'll do my best</text>
    <text x="84" y="330">to help you out!</text>
  </g>
  <g class="meta bad" font-size="12">
    <text x="84" y="460">✗ praise for typing  ✗ 3 open questions  ✗ "full sentence"  ✗ "no rush"  ✗ no action</text>
  </g>

  <!-- AFTER -->
  <rect x="615" y="100" width="545" height="420" rx="12" class="panel"/>
  <text x="639" y="130" class="label">AFTER · presume-competence</text>
  <text x="1135" y="130" text-anchor="end" class="meta good">20 words · 1 question</text>

  <rect x="639" y="148" width="497" height="334" rx="10" class="bubble-ai"/>
  <g class="a" font-size="15">
    <text x="659" y="176" font-weight="700">Do you want a glass of water, or is something wrong with</text>
    <text x="659" y="198" font-weight="700">the water?</text>
    <text x="659" y="234">Tap one:</text>
    <text x="659" y="256">1  drink</text>
    <text x="659" y="278">2  problem</text>
  </g>
  <g class="meta good" font-size="12">
    <text x="659" y="460">✓ input complete  ✓ one question  ✓ A-or-B choice  ✓ adult words  ✓ no praise</text>
  </g>
</svg>
